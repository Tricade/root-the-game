version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: Europe/Berlin
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /tools/asset-generator
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: Europe/Berlin
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
